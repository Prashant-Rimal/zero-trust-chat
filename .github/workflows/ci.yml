name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, security tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 100+ tests: protocol, server-cannot-read, replay, tampering, revocation, impersonation,
      # key substitution, unauthorised group access, metadata leakage, Zero Trust, RBAC, DP.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7

  smoke:
    name: Start the production build and smoke-test it
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: dist/
      - name: Start server (local PGlite database, throwaway secret)
        run: |
          export SERVER_SECRET="$(openssl rand -base64 32)"
          PORT=3000 node serve.mjs > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent --output /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Two headless clients over real HTTP and WebSocket
        run: npm run smoke
        env:
          TARGET_URL: http://localhost:3000
      - name: Server log must contain no request bodies or identifiers beyond route patterns
        if: always()
        run: |
          cat server.log
          ! grep -E '"route":"/api/[^"]*[0-9a-f]{8}-[0-9a-f]{4}' server.log

  benchmark:
    name: Encryption and latency overhead
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: evidence/benchmark.json

  postgres:
    name: Same security tests against Neon Postgres
    needs: verify
    runs-on: ubuntu-latest
    # Opt in by setting the repository variable RUN_NEON_TESTS=true and the secret TEST_DATABASE_URL
    # to a disposable Neon branch. The suite drops and recreates the public schema.
    if: vars.RUN_NEON_TESTS == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run --no-file-parallelism
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate

name: Build, security, test and staging validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
  sast:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run security
      - name: Semgrep project security rules
        run: |
          python -m pip install semgrep
          semgrep scan --config .semgrep.yml --error --json --output evidence/semgrep.json server public shared
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-security
          path: evidence/*scan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep
          path: evidence/semgrep.json
  test:
    needs: sast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run benchmark
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-browser-evidence
          path: evidence/
  dependency-and-secrets:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate --json > evidence/dependency-audit.json
      - name: Gitleaks repository history scan
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source=/repo --report-format=json --report-path=/repo/evidence/gitleaks.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-and-secrets
          path: |
            evidence/dependency-audit.json
            evidence/gitleaks.json
  deploy-staging:
    needs: dependency-and-secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Assemble deployable artifact
        run: |
          mkdir staging
          cp -r server shared public package.json package-lock.json staging/
          cd staging
          npm ci --omit=dev
      - name: Deploy to isolated runner and smoke test
        run: |
          cd staging
          node server/index.js &
          APP_PID=$!
          trap 'kill "$APP_PID"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:3000/ > /tmp/cipherroom.html; then break; fi
            sleep 1
          done
          grep -q 'Cipherroom' /tmp/cipherroom.html
      - name: Package source and lockfile only
        run: tar -czf cipherroom-deploy.tar.gz server shared public package.json package-lock.json README.md docs
      - uses: actions/upload-artifact@v4
        with:
          name: deployable-cipherroom
          path: cipherroom-deploy.tar.gz

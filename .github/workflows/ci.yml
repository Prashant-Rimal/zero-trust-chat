name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, security tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 100+ tests: protocol, server-cannot-read, replay, tampering, revocation, impersonation,
      # key substitution, unauthorised group access, metadata leakage, Zero Trust, RBAC, DP.
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build
          path: dist/
          retention-days: 7

  smoke:
    name: Start the production build and smoke-test it
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: dist/
      - name: Start server (local PGlite database, throwaway secret)
        run: |
          export SERVER_SECRET="$(openssl rand -base64 32)"
          PORT=3000 node serve.mjs > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent --output /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Two headless clients over real HTTP and WebSocket
        run: npm run smoke
        env:
          TARGET_URL: http://localhost:3000
      - name: Server log must contain no request bodies or identifiers beyond route patterns
        if: always()
        run: |
          cat server.log
          ! grep -E '"route":"/api/[^"]*[0-9a-f]{8}-[0-9a-f]{4}' server.log

  benchmark:
    name: Encryption and latency overhead
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run benchmark
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark
          path: evidence/benchmark.json

  postgres:
    name: Same security tests against Neon Postgres
    needs: verify
    runs-on: ubuntu-latest
    # Opt in by setting the repository variable RUN_NEON_TESTS=true and the secret TEST_DATABASE_URL
    # to a disposable Neon branch. The suite drops and recreates the public schema.
    if: vars.RUN_NEON_TESTS == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run --no-file-parallelism
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # --error makes any finding fail the job. Findings are printed in the log and kept as SARIF.
      - run: semgrep scan --config p/default --error --text --sarif-output=semgrep.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: semgrep-report
          path: semgrep.sarif

  secrets:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: a secret that was committed and later removed is still a leak.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dast:
    name: DAST (OWASP ZAP baseline)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build
          path: dist/
      - name: Start server (local PGlite database, throwaway secret)
        run: |
          export SERVER_SECRET="$(openssl rand -base64 32)"
          PORT=3000 node serve.mjs > server.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent --output /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Passive scan of the running production build
        # -I: warnings are reported but do not fail the job; a rule set to FAIL still does.
        run: |
          mkdir zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -I -r zap-report.html -J zap-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: zap-report
          path: zap/

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
